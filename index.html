<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Wallet Sync - Master Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --tin: #00d2ff; --nut: #ff69b4; --shared: #a29bfe; --save: #ffd700; --bg: #0d0f11; --card: #161a1d; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); margin: 0; padding: 10px; color: #e0e0e0; overflow-x: hidden; }
        .container { max-width: 500px; margin: auto; padding-bottom: 50px; }
        .live-clock { text-align: center; margin-bottom: 10px; background: var(--card); padding: 10px; border-radius: 20px; border: 1px solid #333; }
        .time { font-size: 1.6rem; font-weight: bold; color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .sync-status { font-size: 0.65rem; color: #888; text-align: center; margin-bottom: 10px; }
        .shared-card { background: linear-gradient(135deg, #1a1d21, #000); border-radius: 20px; padding: 15px; text-align: center; border: 1px solid #333; margin-bottom: 12px; cursor: pointer; position: relative; transition: 0.3s; }
        .shared-card.active { border-color: var(--shared); box-shadow: 0 0 15px rgba(162, 155, 254, 0.3); background: #1c1a25; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .user-card { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid #333; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .user-card.active-tin { border-color: var(--tin); box-shadow: 0 0 10px var(--tin); background: #1c2227; }
        .user-card.active-nut { border-color: var(--nut); box-shadow: 0 0 10px var(--nut); background: #251a21; }
        .save-tag { background: rgba(255, 215, 0, 0.05); border: 1px dashed var(--save); padding: 5px; border-radius: 10px; margin-top: 8px; font-size: 0.85rem; font-weight: bold; color: var(--save); }
        .menu-wrap { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #2d3436; margin-bottom: 15px; }
        .label { font-size: 0.7rem; color: #666; display: block; margin: 12px 0 6px 0; font-weight: bold; text-transform: uppercase; border-left: 3px solid #444; padding-left: 8px; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .tag-btn { background: #25292e; border: 1px solid #333; color: #ccc; padding: 10px 2px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; }
        .record-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #2d3436; margin-bottom: 15px; }
        input, select { background: #0d0f11; border: 1px solid #333; color: #fff; width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 1rem; outline: none; }
        .btn-main { width: 100%; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-tin { background: var(--tin); color: #000; }
        .btn-nut { background: var(--nut); color: #fff; }
        .btn-shared { background: var(--shared); color: #000; }
        .hist-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #25292e; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="live-clock">
        <div class="time" id="clock-t">00:00:00</div>
        <div style="font-size:0.8rem; color:#888" id="clock-d"></div>
    </div>
    <div class="sync-status" id="sync-status">ระบบ Cloud พร้อมเชื่อมต่อ</div>

    <!-- แถบเลือก กองกลาง -->
    <div class="shared-card" id="v-shared" onclick="selectUser('กองกลาง')">
        <div style="font-size: 0.7rem; color: #888;">💰 ยอดกองกลางสะสม</div>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--shared);" id="bal-shared">฿ 0</div>
    </div>

    <!-- แถบเลือก บุคคล -->
    <div class="dashboard">
        <div class="user-card" id="v-tin" onclick="selectUser('ติณห์ภัทร')">
            <div style="font-size:0.75rem; color:var(--tin)">ติณห์ภัทร</div>
            <div id="bal-tin" style="font-weight:bold">฿ 0</div>
            <div class="save-tag">ออม: <span id="v-tin-s">฿ 0</span></div>
        </div>
        <div class="user-card" id="v-nut" onclick="selectUser('นัฐณววรณ')">
            <div style="font-size:0.75rem; color:var(--nut)">นัฐณววรณ</div>
            <div id="bal-nut" style="font-weight:bold">฿ 0</div>
            <div class="save-tag">ออม: <span id="v-nut-s">฿ 0</span></div>
        </div>
    </div>

    <!-- รายการด่วน (ล็อคค่าทั้งหมด) -->
    <div class="menu-wrap">
        <span class="label">💵 การเงิน & ออม & กองกลาง</span>
        <div class="btn-grid">
            <button class="tag-btn" onclick="quick('เงินเดือน', 'income')">💰 รับเงินเดือน</button>
			<button class="tag-btn" onclick="quick('งานเสริม/OT', 'income')">💰 งานเสริม (OT)</button>
            <button class="tag-btn" onclick="quick('ฝากเงินออม', 'save')" style="color:var(--save)">💎 ฝากออม</button>
            <button class="tag-btn" onclick="quick('ถอนเงินออม', 'withdraw_save')" style="color:var(--save)">🔓 ถอนออม</button>
            <button class="tag-btn" onclick="quick('โอนเข้ากองกลาง', 'transfer_in')" style="color:var(--shared)">📩 เข้ากลาง</button>
            <button class="tag-btn" onclick="quick('ถอนเงินกองกลาง', 'transfer_out')" style="color:var(--shared)">🔓 ถอนกลาง</button>
            <button class="tag-btn" onclick="pullData()">🔄 ดึงข้อมูลใหม่</button>
        </div>
        <span class="label">🚗 เดินทาง & รถ</span>
        <div class="btn-grid">
            <button class="tag-btn" onclick="quick('ค่ารถยนต์', 'expense')">⛽ รถยนต์</button>
            <button class="tag-btn" onclick="quick('ค่าน้ำมันรถ', 'expense')">⛽ น้ำมัน</button>
            <button class="tag-btn" onclick="quick('Easy Pass', 'expense')">🛣️ Easy Pass</button>
            <button class="tag-btn" onclick="quick('ค่าที่จอดรถ', 'expense')">🅿️ ที่จอดรถ</button>
            <button class="tag-btn" onclick="quick('Taxi/Grab', 'expense')">🚖 Taxi</button>
        </div>
        <span class="label">🛍️ ส่วนตัว & บิล & สัตว์</span>
        <div class="btn-grid">
            <button class="tag-btn" onclick="quick('ค่าอาหาร', 'expense')">🍚 อาหาร</button>
            <button class="tag-btn" onclick="quick('บิลต่างๆ', 'expense')">⚡ บิลต่างๆ</button>
			<button class="tag-btn" onclick="quick('ค่าไฟ', 'expense')">⚡ ค่าไฟ</button>
			<button class="tag-btn" onclick="quick('ค่าน้ำ', 'expense')">⚡ ค่าน้ำ</button>
            <button class="tag-btn" onclick="quick('อาหารสัตว์', 'expense')">🐾 อาหารสัตว์</button>
            <button class="tag-btn" onclick="quick('PS5/เกม', 'expense')">🎮 PS5/เกม</button>
            <button class="tag-btn" onclick="quick('ของส่วนตัว/เสื้อผ้า', 'expense')">👕 ส่วนตัว</button>
            <button class="tag-btn" onclick="quick('ภาษี/ประกัน', 'expense')">📄 ประกัน</button>
        </div>
    </div>

    <div class="record-box">
        <div style="text-align:center; font-size:0.8rem; margin-bottom:10px; color:#888;">บันทึกให้: <span id="cur-target" style="font-weight:bold">ติณห์ภัทร</span></div>
        <input type="text" id="desc" placeholder="รายการ">
        <input type="number" id="amt" placeholder="จำนวนเงิน ฿" inputmode="decimal">
        <select id="type">
            <option value="expense">รายจ่าย (-)</option>
            <option value="income">รายรับ (+)</option>
            <option value="save">ฝากออม (💎)</option>
            <option value="withdraw_save">ถอนออม (🔓)</option>
            <option value="transfer_in">โอนเข้ากองกลาง (📩)</option>
            <option value="transfer_out">ถอนจากกองกลาง (🔓)</option>
        </select>
        <button id="save-btn" class="btn-main btn-tin" onclick="saveData()">🚀 บันทึกข้อมูล</button>
    </div>

    <div style="background:#161a1d; padding:15px; border-radius:20px; border:1px solid #333;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="font-size:0.8rem; color:#666;">ประวัติ: <span id="v-label"></span></div>
            <input type="date" id="date-f" style="width:auto; margin:0; padding:5px; font-size:0.75rem;" onchange="render()">
        </div>
        <div id="list"></div>
    </div>
</div>

<script>
    // --- ตั้งค่า URL ที่ได้จาก Google Apps Script ตรงนี้ ---
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxli8eC3_rUGXaFKBdwsjrxYBkNp8jTZL7EFkuBHL_G2raCi4t9_OHUm0hj3uTvdjWtmA/exec';
    const LOCAL_KEY = 'family_wallet_master_final_stable';
    
    let db = JSON.parse(localStorage.getItem(LOCAL_KEY)) || [];
    let current = 'ติณห์ภัทร';

    function clock() {
        const now = new Date();
        document.getElementById('clock-t').innerText = now.toLocaleTimeString('th-TH');
        document.getElementById('clock-d').innerText = now.toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    }
    setInterval(clock, 1000); clock();

    async function pullData() {
        if (!GOOGLE_SHEET_URL.startsWith('http')) return;
        document.getElementById('sync-status').innerText = '🔄 กำลังซิงค์ข้อมูลจาก Cloud...';
        try {
            const res = await fetch(GOOGLE_SHEET_URL);
            const cloudData = await res.json();
            db = cloudData;
            localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
            document.getElementById('sync-status').innerText = '✅ ซิงค์สำเร็จ: ข้อมูลเป็นปัจจุบัน';
            render();
        } catch (e) {
            document.getElementById('sync-status').innerText = '❌ เชื่อม Cloud ไม่ได้ (ใช้ข้อมูลในเครื่อง)';
            render();
        }
    }

    function selectUser(u) {
        current = u;
        document.getElementById('cur-target').innerText = u;
        document.getElementById('cur-target').style.color = (u==='ติณห์ภัทร') ? 'var(--tin)' : (u==='นัฐณววรณ' ? 'var(--nut)' : 'var(--shared)');
        document.getElementById('save-btn').className = 'btn-main ' + (u==='ติณห์ภัทร' ? 'btn-tin' : (u==='นัฐณววรณ' ? 'btn-nut' : 'btn-shared'));
        render();
    }

    function quick(n, t) { document.getElementById('desc').value = n; document.getElementById('type').value = t; document.getElementById('amt').focus(); }

    async function saveData() {
        const d = document.getElementById('desc').value; const t = document.getElementById('type').value; const a = parseFloat(document.getElementById('amt').value);
        if(!d || !a) return alert('ใส่ข้อมูลให้ครบ');
        
        const entry = { id: Date.now(), owner: current, desc: d, type: t, amt: a, time: new Date().toISOString() };
        
        // บันทึกเครื่องก่อนทันที
        db.push(entry);
        localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
        render();
        document.getElementById('desc').value = ''; document.getElementById('amt').value = '';

        // พยายามส่งไป Cloud
        if (GOOGLE_SHEET_URL.startsWith('http')) {
            document.getElementById('sync-status').innerText = '📤 กำลังส่งข้อมูลไป Cloud...';
            try {
               await fetch(GOOGLE_SHEET_URL, { method: 'POST', body: JSON.stringify(entry), mode: 'no-cors' });
                document.getElementById('sync-status').innerText = '✅ บันทึก Cloud สำเร็จ';
            } catch (e) {
                document.getElementById('sync-status').innerText = '⚠️ บันทึกแค่ในเครื่อง (Cloud ไม่สำเร็จ)';
            }
        }
    }
    async function del(id) {
    if(confirm('ลบรายการนี้ทั้งในเครื่องและ Cloud?')) {
        // 1. ลบในหน้าแอปทันที (ใช้ == เพื่อให้เทียบเลขกับตัวอักษรได้)
        db = db.filter(i => i.id != id); 
        localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
        render();

        // 2. ส่งคำสั่งไปลบที่ Google Sheets
        if (GOOGLE_SHEET_URL.startsWith('http')) {
            document.getElementById('sync-status').innerText = '🗑️ กำลังลบข้อมูลใน Cloud...';
            try {
                // ส่ง id ไปที่ Apps Script
                await fetch(`${GOOGLE_SHEET_URL}?action=delete&id=${id}&t=${Date.now()}`, { 
                    method: 'GET',
                    mode: 'no-cors' 
                });
                document.getElementById('sync-status').innerText = '✅ ลบข้อมูลสำเร็จ';
            } catch (e) {
                document.getElementById('sync-status').innerText = '⚠️ ลบใน Cloud ไม่สำเร็จ';
            }
        }
    }
}

    function render() {
        const fDate = document.getElementById('date-f').value;
        document.getElementById('v-shared').className = 'shared-card' + (current === 'กองกลาง' ? ' active' : '');
        document.getElementById('v-tin').className = 'user-card' + (current === 'ติณห์ภัทร' ? ' active-tin' : '');
        document.getElementById('v-nut').className = 'user-card' + (current === 'นัฐณววรณ' ? ' active-nut' : '');
        document.getElementById('v-label').innerText = current;

        let w = { 'ติณห์ภัทร': 0, 'นัฐณววรณ': 0, 'กองกลาง': 0 }; 
        let v = { 'ติณห์ภัทร': 0, 'นัฐณววรณ': 0 };

        db.forEach(i => {
            const amt = parseFloat(i.amt);
            if(i.type === 'income') w[i.owner] += amt;
            else if(i.type === 'expense') w[i.owner] -= amt;
            else if(i.type === 'save') { w[i.owner] -= amt; v[i.owner] += amt; }
            else if(i.type === 'withdraw_save') { v[i.owner] -= amt; w[i.owner] += amt; }
            else if(i.type === 'transfer_in') { w[i.owner] -= amt; w['กองกลาง'] += amt; }
            else if(i.type === 'transfer_out') { w['กองกลาง'] -= amt; w[i.owner] += amt; }
        });

        document.getElementById('bal-tin').innerText = '฿ ' + w['ติณห์ภัทร'].toLocaleString();
        document.getElementById('bal-nut').innerText = '฿ ' + w['นัฐณววรณ'].toLocaleString();
        document.getElementById('v-tin-s').innerText = '฿ ' + v['ติณห์ภัทร'].toLocaleString();
        document.getElementById('v-nut-s').innerText = '฿ ' + v['นัฐณววรณ'].toLocaleString();
        document.getElementById('bal-shared').innerText = '฿ ' + w['กองกลาง'].toLocaleString();

        const listDiv = document.getElementById('list'); listDiv.innerHTML = '';
        db.filter(i => {
            const isU = i.owner === current || (current === 'กองกลาง' && (i.type === 'transfer_in' || i.type === 'transfer_out'));
            if (!fDate) return isU;
            const d = new Date(i.time);
            const itemDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return isU && itemDate === fDate;
        }).sort((a,b) => b.id - a.id).forEach(i => {
            let pfx = (i.type==='income' || i.type==='withdraw_save' || (i.type==='transfer_out' && i.owner===current) || (i.type==='transfer_in' && current==='กองกลาง')) ? '+' : '-';
            let clr = (i.type==='save' || i.type==='withdraw_save') ? 'var(--save)' : (pfx==='+' ? '#00ff88' : '#ff4757');
            if (i.type.includes('transfer')) clr = 'var(--shared)';
            listDiv.innerHTML += `<div class="hist-item"><div><strong>${i.desc}</strong><br><small style="color:#666">${new Date(i.time).toLocaleString('th-TH')} | <span onclick="del('${i.id}')" style="color:#ff4757; cursor:pointer;">ลบ</span></small></div><div style="color:${clr}; font-weight:bold">${pfx}${parseFloat(i.amt).toLocaleString()}</div></div>`;
    }

    pullData(); // ซิงค์ตอนเปิดแอป
    selectUser('ติณห์ภัทร');
</script>
</body>
</html>
