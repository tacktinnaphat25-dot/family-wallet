<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Wallet</title>
    <style>
        /* CSS เบื้องต้นเพื่อให้หน้าตาสวยงามเหมือนเดิม */
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .timer { color: #00ff00; font-size: 2rem; font-weight: bold; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .tag-btn { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .tag-btn:active { background: #444; transform: scale(0.95); }
        .input-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; }
        .label { align-self: flex-start; font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- ส่วนแสดงเวลา -->
    <div class="timer" id="timer">00:00:00</div>

    <div class="card">
        <div>ระบบ Cloud พร้อมใช้งาน</div>
        <h2 id="total-balance">฿ 0</h2>
        <div style="display: flex; justify-content: space-around; font-size: 0.8rem; color: #aaa;">
            <div>ธัญญภัทร์: <span id="user1-val">฿ 0</span></div>
            <div>รัตนาภรณ์: <span id="user2-val">฿ 0</span></div>
        </div>
    </div>

    <!-- ปุ่มหมวดหมู่ -->
    <div class="label">หมวดหมู่ & รายการ</div>
    <div class="btn-grid">
        <button class="tag-btn" onclick="quick('ค่ารถยนต์', 'expense')">🚗 รถยนต์</button>
        <button class="tag-btn" onclick="quick('ค่าน้ำมัน', 'expense')">⛽ ค่าน้ำมัน</button>
        <button class="tag-btn" onclick="quick('ค่าอาหาร', 'expense')">🍱 อาหาร</button>
        <button class="tag-btn" onclick="quick('ค่าไฟ', 'expense')">⚡ ค่าไฟ</button>
        <button class="tag-btn" onclick="quick('ค่าน้ำ', 'expense')">💧 ค่าน้ำ</button>
        <button class="tag-btn" onclick="pullData()">🔄 ดึงข้อมูลใหม่</button>
    </div>

    <!-- ส่วนบันทึกข้อมูล -->
    <div class="input-group">
        <div style="font-size: 0.8rem; color: #888;">บันทึกให้: <span id="cur-user" style="color: #fff; font-weight: bold;">ยังไม่ได้เลือก</span></div>
        <div style="font-size: 0.8rem; color: #888;">รายการที่เลือก: <span id="cur-target" style="color: #fff; font-weight: bold;">-</span></div>
        <input type="text" id="id-desc" placeholder="ชื่อรายการ">
        <input type="number" id="amount-input" placeholder="จำนวนเงิน ฿">
        <select id="type-select">
            <option value="expense">รายจ่าย (-)</option>
            <option value="income">รายรับ (+)</option>
        </select>
        <button class="tag-btn" style="background: #28a745; border: none; font-weight: bold;" onclick="saveRecord()">✔ บันทึกข้อมูล</button>
    </div>

    <script>
        // 1. ฟังก์ชันเวลาเดิน (Timer)
        function updateTime() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ":" + 
                               now.getMinutes().toString().padStart(2, '0') + ":" + 
                               now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timer').innerText = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. ฟังก์ชันปุ่มด่วน (Quick Select) - แก้ไขให้รองรับ 'ค่ารถยนต์'
        function quick(name, type) {
            document.getElementById('id-desc').value = name;
            document.getElementById('cur-target').innerText = name;
            document.getElementById('type-select').value = type;
            console.log("เลือกรายการ:", name);
        }

        // 3. ฟังก์ชันดึงข้อมูลใหม่ (Refresh)
        function pullData() {
            alert("กำลังดึงข้อมูลล่าสุดจากระบบ...");
            location.reload();
        }

        // 4. ฟังก์ชันบันทึกข้อมูลเบื้องต้น (ลง Console/Alert)
        function saveRecord() {
            const desc = document.getElementById('id-desc').value;
            const amount = document.getElementById('amount-input').value;
            const type = document.getElementById('type-select').value;

            if (!desc || !amount) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            alert("บันทึกรายการ: " + desc + " จำนวน " + amount + " ฿ สำเร็จ!");
            // ในอนาคตคุณสามารถเพิ่มโค้ดส่งไป Google Sheets ตรงนี้ได้
        }

        // 5. เลือกผู้ใช้เริ่มต้น
        window.onload = function() {
            document.getElementById('cur-user').innerText = "ธัญญภัทร์";
        };
    </script>

</body>
</html>
